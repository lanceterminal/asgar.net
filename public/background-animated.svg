<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0c"/>
      <stop offset="45%" stop-color="#080807"/>
      <stop offset="63%" stop-color="#030302"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#332f28" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="18%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#sky)"/>

  <rect width="1000" height="1500" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="18s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke-linecap="round">
    <g opacity="0.28" stroke="#2a2a28" stroke-width="12" filter="url(#blurSoft)">
      <path d="M -120 130 Q 130 90 380 128 Q 630 166 880 122 Q 1030 98 1120 130"/>
      <animateTransform attributeName="transform" type="translate" values="-50 0;50 0;-50 0" dur="30s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.22" stroke="#242422" stroke-width="9" filter="url(#blurSoft)">
      <path d="M -120 240 Q 100 280 360 235 Q 620 190 860 245 Q 1000 272 1120 238"/>
      <animateTransform attributeName="transform" type="translate" values="40 0;-40 0;40 0" dur="24s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.3" stroke="#302f2a" stroke-width="14" filter="url(#blurSoft)">
      <path d="M -120 360 Q 140 400 400 355 Q 660 310 900 365 Q 1020 392 1120 358"/>
      <animateTransform attributeName="transform" type="translate" values="-35 0;35 0;-35 0" dur="34s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.2" stroke="#242422" stroke-width="8" filter="url(#blurSoft)">
      <path d="M -120 490 Q 110 450 370 495 Q 630 540 870 485 Q 1010 458 1120 492"/>
      <animateTransform attributeName="transform" type="translate" values="45 0;-45 0;45 0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.26" stroke="#2c2c29" stroke-width="11" filter="url(#blurSoft)">
      <path d="M -120 630 Q 150 670 410 620 Q 670 570 910 625 Q 1030 652 1120 618"/>
      <animateTransform attributeName="transform" type="translate" values="-55 0;55 0;-55 0" dur="28s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.18" stroke="#201f1d" stroke-width="9" filter="url(#blurSoft)">
      <path d="M -120 780 Q 120 745 380 785 Q 640 825 880 775 Q 1010 750 1120 782"/>
      <animateTransform attributeName="transform" type="translate" values="30 0;-30 0;30 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <path
    d="M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930"
    fill="none" stroke="#f5f4ee" stroke-width="16" opacity="0.35" filter="url(#blurWide)">
    <animate
      attributeName="d"
      dur="9s"
      calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      repeatCount="indefinite"
      values="M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930;
              M -50 928 Q 75 950 200 915 Q 325 880 450 935 Q 575 960 700 905 Q 825 875 950 940 Q 1000 955 1050 920;
              M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930"/>
    <animate attributeName="opacity" values="0.28;0.55;0.28" dur="9s" repeatCount="indefinite"/>
  </path>

  <path
    d="M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930"
    fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <animate
      attributeName="d"
      dur="9s"
      calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      repeatCount="indefinite"
      values="M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930;
              M -50 928 Q 75 950 200 915 Q 325 880 450 935 Q 575 960 700 905 Q 825 875 950 940 Q 1000 955 1050 920;
              M -50 935 Q 75 905 200 928 Q 325 951 450 922 Q 575 893 700 924 Q 825 955 950 918 Q 1000 905 1050 930"/>
  </path>

  <rect x="0" y="930" width="1000" height="570" fill="#000000"/>
  <rect x="0" y="930" width="1000" height="570" fill="#ffffff" opacity="0.02">
    <animate attributeName="opacity" values="0.012;0.05;0.012" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g fill="#ffffff">
    <circle cx="140" cy="915" r="1.6"><animate attributeName="opacity" values="0;0.8;0" dur="3.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="932" r="2"><animate attributeName="opacity" values="0;0.7;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="924" r="1.4"><animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="908" r="1.8"><animate attributeName="opacity" values="0;0.6;0" dur="3.7s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="930" r="1.5"><animate attributeName="opacity" values="0;0.75;0" dur="3.1s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="912" r="2.1"><animate attributeName="opacity" values="0;0.65;0" dur="4.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="928" r="1.5"><animate attributeName="opacity" values="0;0.8;0" dur="3.3s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="240" r="1.3"><animate attributeName="opacity" values="0;0.4;0" dur="5.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="360" r="1.3"><animate attributeName="opacity" values="0;0.35;0" dur="6.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="630" r="1.4"><animate attributeName="opacity" values="0;0.4;0" dur="5.6s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <rect width="1000" height="1500" fill="url(#vignette)"/>
</svg>
